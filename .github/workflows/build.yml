name: Build

on:
  push:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
      packages: write

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
          
      - name: build backend
        working-directory: MinecraftManagementAPI/MinecraftManagementAPI
        run: dotnet publish MinecraftManagementAPI.csproj -c Release -r linux-x64 --self-contained true -o ${{ github.workspace }}/backend

      - name: login into registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}_backend

      - name: build and push the image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./MinecraftManagementAPI/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      
      - name: generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX}}_backend
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      

